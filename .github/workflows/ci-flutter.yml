# CI: Flutter SDK (Flutter 3.24+ / Dart 3.5+).
#
# `agil/mobile/flutter` is a pure-Dart package (no android/ or ios/ folders),
# so `flutter build apk` is executed against its example app after scaffolding
# an ephemeral Android host with `flutter create` in the CI workspace. Nothing
# generated by that step is committed.
#
# No deployment, no store upload, no code signing.
name: CI / Flutter

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  FLUTTER_VERSION: '3.24.5'

jobs:
  flutter:
    name: Flutter 3.24
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: agil/mobile/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          set -euo pipefail
          flutter config --jdk-dir "$JAVA_HOME"
          flutter --version
          dart --version

      - name: Cache pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('agil/mobile/flutter/pubspec.yaml', 'agil/mobile/flutter/example/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Scaffold example Android host (CI-only)
        working-directory: agil/mobile/flutter/example
        run: |
          set -euo pipefail
          flutter pub get
          # Preserve the SDK demo entry point and path dependency in case the
          # template tries to overwrite them while adding android/.
          cp pubspec.yaml "$RUNNER_TEMP/agil-example-pubspec.yaml"
          cp lib/main.dart "$RUNNER_TEMP/agil-example-main.dart"
          flutter create --platforms=android --org com.agilcalls --project-name agil_calls_example .
          cp "$RUNNER_TEMP/agil-example-pubspec.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/agil-example-main.dart" lib/main.dart
          flutter pub get

      - name: Build debug APK
        working-directory: agil/mobile/flutter/example
        run: flutter build apk --debug

      - name: Upload APK and test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-results-${{ github.sha }}
          path: |
            agil/mobile/flutter/example/build/app/outputs/flutter-apk/*.apk
            agil/mobile/flutter/example/build/app/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
